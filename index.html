<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#222222"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tabata"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Tabata</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<header><button id="settings" class="icon" aria-label="Réglages">⚙</button><div><b>TABATA</b><span id="total">00:00</span></div><button id="resetTop" class="icon" aria-label="Réinitialiser">↻</button></header>
<section id="phase" class="phase prep"><div class="label" id="phaseLabel">PRÉPARER</div><div class="timer" id="timer">00:05</div></section>
<section class="next"><div id="nextLabel">EXERCICE</div><div id="nextTime">00:59</div></section>
<section class="controls"><div><strong id="roundsLeft">4</strong><small>ROUNDS RESTANTS</small></div><button id="start" class="play" aria-label="Commencer">▶</button><div><strong id="cyclesLeft">3</strong><small>CYCLES RESTANTS</small></div><div class="status" id="status">COMMENCER</div></section>
<section id="panel" class="panel hidden"><h2>RÉGLAGES</h2><label>Préparation (s)<input id="prep" type="number" min="1" max="60" value="5"></label><label>Exercice (s)<input id="work" type="number" min="1" max="3600" value="59"></label><label>Repos (s)<input id="rest" type="number" min="1" max="600" value="20"></label><label>Rounds / cycle<input id="rounds" type="number" min="1" max="99" value="4"></label><label>Cycles<input id="cycles" type="number" min="1" max="99" value="3"></label><button id="save">ENREGISTRER</button></section>
<footer>TABATA TIMER • iPHONE</footer></main><script src="app.js"></script></body></html>
